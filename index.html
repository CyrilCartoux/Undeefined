<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyril Cartoux — Senior Full-Stack Engineer</title>
    <meta name="description" content="Cyril Cartoux — Senior Full-Stack Engineer (React, Next.js, TypeScript, Node.js, Web3). I design, build and run SaaS products, from architecture to production. Aix-en-Provence, France.">
    <meta name="author" content="Cyril Cartoux">
    <meta property="og:title" content="Cyril Cartoux — Senior Full-Stack Engineer">
    <meta property="og:description" content="I design, build and run SaaS products — from architecture to production.">
    <meta property="og:type" content="profile">
    <meta name="theme-color" content="#0d1014">
    <script>document.documentElement.classList.add('js');</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <aside class="rail">
        <a href="#profile" class="brand">cyril@cartoux<span class="caret" aria-hidden="true"></span></a>
        <nav class="rail-nav" id="nav" aria-label="Sections"></nav>
        <div class="rail-tools">
            <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language"></button>
            <button class="shell-btn" id="shell-open" type="button"><span aria-hidden="true">&gt;_</span> shell <kbd>`</kbd></button>
        </div>
        <div class="rail-progress" aria-hidden="true"><span id="progress"></span></div>
    </aside>

    <main class="main">
        <section id="profile" class="sec">
            <header class="sec-head"></header>
            <div class="profile">
                <div class="identity">
                    <h1 class="name">Cyril Cartoux</h1>
                    <p class="role" id="hero-role"></p>
                    <p class="pitch" id="hero-pitch"></p>
                    <ul class="meta" id="hero-meta"></ul>
                    <div class="ctas">
                        <a class="btn btn-primary" id="cta-mail" href=""></a>
                        <a class="btn" id="cta-work" href="#work"></a>
                    </div>
                </div>
                <div class="selected">
                    <p class="selected-title" id="selected-title"></p>
                    <ol class="selected-list" id="selected-list"></ol>
                </div>
            </div>
            <div class="stats-wrap">
                <dl class="stats" id="hero-stats"></dl>
                <p class="stats-source" id="stats-source"></p>
            </div>
        </section>

        <section id="work" class="sec">
            <header class="sec-head"></header>
            <div class="inspector">
                <div class="inspector-list" id="work-list" role="tablist" aria-orientation="vertical"></div>
                <div class="inspector-panel" id="work-panel" role="tabpanel" aria-live="polite"></div>
            </div>
        </section>

        <section id="career" class="sec">
            <header class="sec-head"></header>
            <div class="gitlog" id="gitlog"></div>
        </section>

        <section id="stack" class="sec">
            <header class="sec-head"></header>
            <div id="stack-body"></div>
        </section>

        <section id="lab" class="sec">
            <header class="sec-head"></header>
            <div class="lab" id="lab-list"></div>
        </section>

        <section id="contact" class="sec">
            <header class="sec-head"></header>
            <div id="contact-body"></div>
        </section>

        <noscript><p>cyrilcartoux13@gmail.com · github.com/CyrilCartoux</p></noscript>

        <footer class="foot">
            <span>© 2026 Cyril Cartoux · undeefined</span>
            <span>built by hand · no framework</span>
        </footer>
    </main>

    <div class="shell" id="shell" hidden>
        <div class="shell-window" role="dialog" aria-modal="true" aria-label="Terminal">
            <div class="shell-bar">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span class="shell-title">cyril@cartoux: ~ — zsh</span>
                <button class="shell-close" id="shell-close" type="button" aria-label="Close">×</button>
            </div>
            <div class="shell-body" id="shell-body">
                <div class="shell-out" id="shell-out" aria-live="polite"></div>
                <form class="shell-line" id="shell-form" autocomplete="off">
                    <label for="shell-input" class="ps1">cyril@cartoux:~$</label>
                    <input id="shell-input" class="shell-input" spellcheck="false" autocapitalize="off" autocomplete="off">
                </form>
            </div>
            <div class="shell-chips" id="shell-chips"></div>
        </div>
    </div>

    <script src="js/content.js"></script>
    <script src="js/script.js"></script>
    <script src="js/shell.js"></script>
</body>
</html>
